name: Reconcile Planora lockfile
on:
  pull_request:
    paths: ['package.json', 'package-lock.json', '.github/workflows/reconcile-planora-lockfile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/check-dependency-conflicts.mjs
      - name: Verify committed lockfile without rewriting the PR
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: git diff --exit-code -- package.json package-lock.json
