name: Reconcile Planora lockfile
on:
  push:
    branches:
      - feat/public-experience-showcase-20261018
    paths:
      - package.json
      - .github/workflows/reconcile-planora-lockfile.yml
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/reconcile-planora-lockfile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate-lockfile:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/feat/public-experience-showcase-20261018') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/public-experience-showcase-20261018')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          ref: feat/public-experience-showcase-20261018
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate reconciled manifest
        run: node -e "const p=require('./package.json'); if(!p.dependencies?.next || !p.devDependencies?.prisma) process.exit(1)"
      - name: Upgrade npm resolver and remove stale installation state
        run: |
          npm install --global npm@11.6.2
          npm --version
          rm -rf node_modules
      - name: Generate fresh lockfile from reviewed manifest
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
          node scripts/check-dependency-conflicts.mjs
          npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Commit generated lockfile to feature branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(build): regenerate consistent npm lockfile"
          git push origin HEAD:feat/public-experience-showcase-20261018
