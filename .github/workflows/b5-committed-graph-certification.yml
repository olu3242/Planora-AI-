name: B5 committed dependency certification
on:
  push:
    branches: [work/b1-b10-release-certification-20261022]
    paths: ['.github/workflows/b5-committed-graph-certification.yml', 'package.json', 'package-lock.json', 'eslint.config.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planora_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: planora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: test
      APP_URL: http://127.0.0.1:3000
      SESSION_COOKIE_NAME: planora_ci_session
      SESSION_TTL_HOURS: '12'
      TEST_DATABASE_URL: postgresql://planora_test:local_ci_only@127.0.0.1:5432/planora_test?schema=public
      DATABASE_URL: postgresql://planora_test:local_ci_only@127.0.0.1:5432/planora_test?schema=public
      TEST_RUNTIME_DATABASE_URL: postgresql://planora_runtime:local_ci_runtime_2026@127.0.0.1:5432/planora_test?schema=public
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Reproduce committed dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify replacement manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(p.devDependencies?.['eslint-config-next']) throw new Error('Legacy ESLint dependency retained');
          if(!p.devDependencies?.['@next/eslint-plugin-next']) throw new Error('Next plugin missing');
          if(!p.dependencies?.zod?.includes('4.6.7')) throw new Error('Patched Zod missing');
          if(p.overrides?.braces !== '3.0.3') throw new Error('Patched braces override missing');
          NODE
          npm ls braces micromatch fast-glob zod @next/eslint-plugin-next
      - name: ESLint canaries and application lint
        run: |
          node scripts/check-eslint-canaries.mjs
          npx eslint app src pages components lib scripts --no-error-on-unmatched-pattern
      - name: Application regressions
        run: |
          npm run typecheck
          npm run test:unit
          npm run test:financial
          npm run test:excel
          npm run build
      - name: PostgreSQL and security regressions
        run: |
          npm run db:migrate:test
          npm run db:seed:test
          node --import tsx scripts/provision-test-runtime.ts
          npm run test:security
          npm run test:performance
          npm run test:integration
          npm run db:status:test
      - name: Audit committed lockfile
        if: ${{ success() || failure() }}
        run: npm audit --audit-level=moderate
