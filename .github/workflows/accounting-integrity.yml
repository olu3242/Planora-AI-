name: Accounting integrity
on:
  workflow_dispatch:
  push:
    branches:
      - fix/accounting-fpa-schema-harmonization
      - work/accounting-e2e-certification-20261012
    paths:
      - "src/domain/accounting/**"
      - "prisma/migrations/**"
      - "src/application/accounting/**"
      - "src/lib/accounting/**"
      - "src/lib/orchestration/**"
      - "tests/integration/reporting-governance.test.ts"
      - "tests/unit/accounting-*.test.ts"
      - ".github/workflows/accounting-integrity.yml"
  pull_request:
    paths:
      - "src/domain/accounting/**"
      - "prisma/migrations/**"
      - "src/application/accounting/**"
      - "src/lib/accounting/**"
      - "src/lib/orchestration/**"
      - "tests/integration/reporting-governance.test.ts"
      - "tests/unit/accounting-*.test.ts"
      - ".github/workflows/accounting-integrity.yml"
jobs:
  accounting-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://planora:planora_ci@127.0.0.1:5432/planora?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx vitest run tests/unit/accounting-*.test.ts
      - run: npm run typecheck
