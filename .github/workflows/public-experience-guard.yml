name: Public experience static guard
on:
  pull_request:
    paths:
      - 'src/app/experience/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-dependency-conflicts.mjs'
      - 'src/components/brand-landing.tsx'
      - 'scripts/check-public-experience.mjs'
      - 'tests/security/public-experience-guard.test.mjs'
      - '.github/workflows/public-experience-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-content-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node scripts/check-merge-conflicts.mjs
      - name: Validate dependency manifests
        run: node scripts/check-dependency-conflicts.mjs
      - name: Test public marketing guard
        run: node --test tests/security/public-experience-guard.test.mjs
      - name: Scan public marketing source
        run: node scripts/check-public-experience.mjs
