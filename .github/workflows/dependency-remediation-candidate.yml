name: Dependency Remediation Candidate
on:
  workflow_dispatch:
  push:
    branches: [work/bookkeeping-harmonization-b1-20261015]
    paths: [.github/workflows/dependency-remediation-candidate.yml]
  pull_request:
    paths: [.github/workflows/dependency-remediation-candidate.yml]
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Establish baseline
        run: |
          mkdir -p dist/remediation
          npm ci
          npm audit --json > dist/remediation/baseline-audit.json || true
      - name: Resolve compatible dependency updates without forced downgrades
        run: |
          npm update --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts
          # Attempt npm-supported, non-forced advisory repairs on the candidate only.
          # A nonzero audit-fix exit is recorded; the final audit remains fail-closed.
          if npm audit fix --package-lock-only --ignore-scripts > dist/remediation/audit-fix-output.txt 2>&1; then
            echo audit_fix_exit=0 > dist/remediation/audit-fix-status.txt
          else
            status=$?
            echo "audit_fix_exit=$status" > dist/remediation/audit-fix-status.txt
          fi
          git diff -- package.json package-lock.json > dist/remediation/lockfile.patch
          cp package-lock.json dist/remediation/package-lock.json
          npm ci
          npm audit --json > dist/remediation/candidate-audit.json || true
          npm audit --omit=dev --json > dist/remediation/candidate-production-audit.json || true
          npm audit --omit=dev --audit-level=moderate > dist/remediation/candidate-production-gate.txt 2>&1 || true
          npm explain braces > dist/remediation/candidate-braces-explain.txt 2>&1 || true
          npm explain micromatch > dist/remediation/candidate-micromatch-explain.txt 2>&1 || true
          npm ls braces micromatch fast-glob @next/eslint-plugin-next eslint-config-next --all > dist/remediation/candidate-tree.txt 2>&1 || true
          printf 'source_sha=%s\n' "$GITHUB_SHA" > dist/remediation/provenance.txt
      - name: Check candidate compatibility
        run: |
          npm run lint
          npm run typecheck
      - name: Investigate supported ESLint alternative without modifying candidate
        if: always()
        run: |
          npm view @next/eslint-plugin-next version dependencies --json > dist/remediation/next-eslint-upstream.json 2>&1 || true
          npm view braces version --json > dist/remediation/braces-upstream.json 2>&1 || true
          npm view micromatch version --json > dist/remediation/micromatch-upstream.json 2>&1 || true
          npm view fast-glob version --json > dist/remediation/fast-glob-upstream.json 2>&1 || true
          npm view eslint-config-next version dependencies --json > dist/remediation/eslint-config-next-upstream.json 2>&1 || true
          npm view @next/eslint-plugin-next@16.4.2 dependencies --json > dist/remediation/installed-next-eslint-dependencies.json 2>&1 || true
          npm view fast-glob@3.3.1 dependencies --json > dist/remediation/installed-fast-glob-dependencies.json 2>&1 || true
          npm view micromatch@4.0.8 dependencies --json > dist/remediation/installed-micromatch-dependencies.json 2>&1 || true
      - name: Enforce candidate security gate
        run: npm audit --audit-level=moderate
      - name: Evaluate alternate ESLint stack in isolated candidate
        if: always()
        run: |
          mkdir -p dist/remediation/alternate
          # This experiment must not replace the existing production lint configuration.
          cp package.json dist/remediation/alternate/original-package.json
          cp package-lock.json dist/remediation/alternate/original-package-lock.json
          cp eslint.config.mjs dist/remediation/alternate/original-eslint.config.mjs
          if npm uninstall --save-dev eslint-config-next --ignore-scripts > dist/remediation/alternate/uninstall.log 2>&1; then uninstall_status=0; else uninstall_status=$?; fi
          if npm install --save-dev --ignore-scripts typescript-eslint eslint-plugin-react eslint-plugin-react-hooks eslint-plugin-jsx-a11y > dist/remediation/alternate/install.log 2>&1; then install_status=0; else install_status=$?; fi
          printf 'alternate_uninstall_exit=%s\nalternate_install_exit=%s\n' "$uninstall_status" "$install_status" > dist/remediation/alternate/dependency-operations-status.txt
          cat > eslint.config.mjs <<'EOF'
          import { defineConfig, globalIgnores } from "eslint/config";
          import tseslint from "typescript-eslint";
          import react from "eslint-plugin-react";
          import reactHooks from "eslint-plugin-react-hooks";
          import jsxA11y from "eslint-plugin-jsx-a11y";
          export default defineConfig([
            ...tseslint.configs.recommended,
            react.configs.flat.recommended,
            react.configs.flat["jsx-runtime"],
            reactHooks.configs.flat.recommended,
            jsxA11y.flatConfigs.recommended,
            {
              // Legacy Next-specific inline disables cannot be resolved without
              // the removed plugin. Keep a no-op rule only for compatibility;
              // do not suppress React Hooks or TypeScript safety checks.
              plugins: { "@next/next": { rules: { "no-img-element": { meta: { type: "problem", docs: { description: "Avoid raw img elements in Next.js UI" }, schema: [] }, create(context) { return { JSXOpeningElement(node) { if (node.name.type === "JSXIdentifier" && node.name.name === "img") context.report({ node, message: "Use next/image rather than a raw img element." }); } }; } } } } },
              rules: {
                "@next/next/no-img-element": "error",
                "jsx-a11y/no-autofocus": "off",
                "jsx-a11y/media-has-caption": "off",
              },
            },
            globalIgnores([".next/**", "coverage/**", "playwright-report/**", "test-results/**", "next-env.d.ts"]),
          ]);
          EOF
          if npm run lint > dist/remediation/alternate/lint.log 2>&1; then lint_status=0; else lint_status=$?; fi
          if npm run typecheck > dist/remediation/alternate/typecheck.log 2>&1; then typecheck_status=0; else typecheck_status=$?; fi
          # Exercise application unit tests with the alternate dependency graph.
          # Passing lint and audit alone is insufficient for promotion.
          if npm run test:unit > dist/remediation/alternate/unit.log 2>&1; then unit_status=0; else unit_status=$?; fi
          # Validate accounting invariants and financial calculation behavior
          # against the alternate dependency graph, beyond generic unit tests.
          if npm run test:financial > dist/remediation/alternate/financial.log 2>&1; then financial_status=0; else financial_status=$?; fi
          if npm run test:integration > dist/remediation/alternate/integration.log 2>&1; then integration_status=0; else integration_status=$?; fi
          npm audit --json > dist/remediation/alternate/audit.json 2>&1 || true
          if npm audit --audit-level=moderate > dist/remediation/alternate/audit-gate.log 2>&1; then audit_status=0; else audit_status=$?; fi
          printf 'alternate_lint_exit=%s\nalternate_typecheck_exit=%s\nalternate_unit_exit=%s\nalternate_audit_exit=%s\n' "$lint_status" "$typecheck_status" "$unit_status" "$audit_status" | tee dist/remediation/alternate/gate-status.txt
          printf 'alternate_financial_exit=%s\nalternate_integration_exit=%s\n' "$financial_status" "$integration_status" >> dist/remediation/alternate/gate-status.txt
          echo '### Alternate ESLint candidate validation' >> "$GITHUB_STEP_SUMMARY"
          cat dist/remediation/alternate/gate-status.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'Alternate ESLint lint output (last 30 lines):'
          tail -n 30 dist/remediation/alternate/lint.log
          echo 'Alternate ESLint audit output (last 30 lines):'
          tail -n 30 dist/remediation/alternate/audit-gate.log
          cp package.json dist/remediation/alternate/package.json
          cp package-lock.json dist/remediation/alternate/package-lock.json
          cp eslint.config.mjs dist/remediation/alternate/eslint.config.mjs
          # Record whether the experimental config replaces any framework rule
          # with a no-op. A zero-exit lint run is not equivalent to framework
          # coverage when this marker is present.
          if grep -q 'no-img-element.*create: () => ({})' dist/remediation/alternate/eslint.config.mjs; then
            printf 'framework_lint_equivalence=unverified_noop_rule\n' > dist/remediation/alternate/coverage-status.txt
            echo 'WARNING: alternate lint includes a no-op Next.js rule; do not promote as equivalent.' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'framework_lint_equivalence=requires_review\n' > dist/remediation/alternate/coverage-status.txt
          fi
          # Audit the scope of framework-specific lint suppressions before
          # considering migration. Keep the existing rules and source unchanged.
          # This counts source files containing inline Next.js lint directives;
          # those directives need real replacement rules, never dummy handlers.
          git grep -n -E 'eslint-disable(-next-line|-line)?[[:space:]]+@next/next/' -- ':!package-lock.json' > dist/remediation/alternate/next-inline-directives.txt || true
          printf 'next_inline_directives=%s\n' "$(wc -l < dist/remediation/alternate/next-inline-directives.txt | tr -d ' ')" > dist/remediation/alternate/next-inline-summary.txt
          cat dist/remediation/alternate/next-inline-summary.txt >> "$GITHUB_STEP_SUMMARY"
          # Verify the alternate graph does not silently omit framework checks.
          # The existing no-op compatibility rule is deliberately treated as
          # an unverified coverage gap, not an acceptable replacement.
          node --input-type=module <<'NODE' > dist/remediation/alternate/lint-parity.json
          import fs from 'node:fs';
          const config = fs.readFileSync('dist/remediation/alternate/eslint.config.mjs', 'utf8');
          const result = {
            nextPluginLoaded: config.includes('@next/eslint-plugin-next'),
            nextRecommendedRulesLoaded: config.includes('eslint-config-next/core-web-vitals'),
            noOpNextRule: config.includes('create: () => ({})'),
            conclusion: 'requires_manual_framework_parity_review'
          };
          process.stdout.write(JSON.stringify(result, null, 2) + String.fromCharCode(10));
          NODE
          # Require a negative-control lint fixture to prove that the
          # replacement image rule reports an actual violation. This does not
          # establish full Next.js framework-rule parity.
          # Place the fixture outside dist/, which is excluded from normal lint
          # traversal. Remove it after evaluation, even when lint exits nonzero.
          fixture=.planora-image-lint-negative-control.tsx
          cat > "$fixture" <<'EOF'
          export function RawImageNegativeControl() {
            return <img src="/negative-control.png" alt="negative control" />;
          }
          EOF
          if npx eslint --no-ignore "$fixture" > dist/remediation/alternate/image-rule-negative-control.log 2>&1; then
            echo 'image_rule_negative_control=FAILED_TO_DETECT' > dist/remediation/alternate/image-rule-status.txt
          elif grep -q '@next/next/no-img-element' dist/remediation/alternate/image-rule-negative-control.log; then
            echo 'image_rule_negative_control=DETECTED' > dist/remediation/alternate/image-rule-status.txt
          else
            echo 'image_rule_negative_control=INCONCLUSIVE' > dist/remediation/alternate/image-rule-status.txt
          fi
          rm -f "$fixture"
          cat dist/remediation/alternate/image-rule-status.txt >> "$GITHUB_STEP_SUMMARY"
          # Capture an explicit negative-control pass/fail exit code, rather
          # than relying on a human-readable summary alone.
          if grep -qx 'image_rule_negative_control=DETECTED' dist/remediation/alternate/image-rule-status.txt; then
            echo 'negative_control_exit=0' >> dist/remediation/alternate/gate-status.txt
          else
            echo 'negative_control_exit=1' >> dist/remediation/alternate/gate-status.txt
          fi
          # Evaluate promotion only after all evidence, including the negative
          # control, exists. A passing audit alone never approves migration.
          if [ "$uninstall_status" -eq 0 ] && [ "$install_status" -eq 0 ] && [ "$lint_status" -eq 0 ] && [ "$typecheck_status" -eq 0 ] && [ "$unit_status" -eq 0 ] && [ "$financial_status" -eq 0 ] && [ "$integration_status" -eq 0 ] && [ "$audit_status" -eq 0 ] && grep -qx 'image_rule_negative_control=DETECTED' dist/remediation/alternate/image-rule-status.txt && grep -qx 'framework_lint_equivalence=verified' dist/remediation/alternate/coverage-status.txt; then
            echo 'promotion_readiness=eligible_for_review' > dist/remediation/alternate/promotion-status.txt
          else
            echo 'promotion_readiness=blocked' > dist/remediation/alternate/promotion-status.txt
          fi
          cat dist/remediation/alternate/promotion-status.txt >> "$GITHUB_STEP_SUMMARY"
          # Publish the complete candidate verdict, including negative-control
          # and financial/integration outcomes, as a durable artifact.
          printf 'source_sha=%s\n' "$GITHUB_SHA" > dist/remediation/alternate/verification-provenance.txt
          printf 'candidate_experiment_only=true\n' >> dist/remediation/alternate/verification-provenance.txt
          printf 'release_certified=false\n' >> dist/remediation/alternate/verification-provenance.txt
          cat dist/remediation/alternate/gate-status.txt dist/remediation/alternate/coverage-status.txt dist/remediation/alternate/image-rule-status.txt dist/remediation/alternate/promotion-status.txt >> dist/remediation/alternate/verification-provenance.txt
          # Provide an actionable, fail-closed summary for reviewers.
          # Never conflate a zero-vulnerability alternate audit with a passing
          # original security gate or completed release certification.
          echo '### Candidate release decision' >> "$GITHUB_STEP_SUMMARY"
          cat dist/remediation/alternate/promotion-status.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'Original security audit and exact-SHA certification must pass independently.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No production dependency changes are made by this workflow.' >> "$GITHUB_STEP_SUMMARY"
          # Preserve the complete, reproducible migration diff for a separate
          # reviewed source change. Never auto-promote this experimental graph.
          git diff -- package.json package-lock.json eslint.config.mjs > dist/remediation/alternate/migration.patch
          sha256sum dist/remediation/alternate/package.json dist/remediation/alternate/package-lock.json dist/remediation/alternate/eslint.config.mjs dist/remediation/alternate/migration.patch > dist/remediation/alternate/migration-sha256.txt
          echo 'migration_patch_requires_review=true' >> dist/remediation/alternate/verification-provenance.txt
          # Ensure the exported migration patch actually contains the proposed
          # manifest and lockfile edits; a checksum of an empty patch is not
          # evidence of a reproducible dependency migration.
          if [ -s dist/remediation/alternate/migration.patch ] && grep -q 'diff --git a/package.json b/package.json' dist/remediation/alternate/migration.patch && grep -q 'diff --git a/package-lock.json b/package-lock.json' dist/remediation/alternate/migration.patch; then
            echo 'migration_patch_integrity=manifest_and_lockfile_present' > dist/remediation/alternate/migration-integrity.txt
          else
            echo 'migration_patch_integrity=incomplete' > dist/remediation/alternate/migration-integrity.txt
          fi
          cat dist/remediation/alternate/migration-integrity.txt >> "$GITHUB_STEP_SUMMARY"
          # Reject an incomplete migration artifact even if earlier checks
          # happened to pass; do not promote a partial lockfile change.
          if ! grep -qx 'migration_patch_integrity=manifest_and_lockfile_present' dist/remediation/alternate/migration-integrity.txt; then
            echo 'promotion_readiness=blocked' > dist/remediation/alternate/promotion-status.txt
            echo 'migration_integrity_exit=1' >> dist/remediation/alternate/gate-status.txt
          else
            echo 'migration_integrity_exit=0' >> dist/remediation/alternate/gate-status.txt
          fi
          cat dist/remediation/alternate/promotion-status.txt >> "$GITHUB_STEP_SUMMARY"
          # Rebuild final provenance only after migration-integrity enforcement.
          # Earlier summaries may predate this final promotion verdict.
          {
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'candidate_experiment_only=true\nrelease_certified=false\n'
            cat dist/remediation/alternate/gate-status.txt
            cat dist/remediation/alternate/dependency-operations-status.txt
            cat dist/remediation/alternate/coverage-status.txt
            cat dist/remediation/alternate/image-rule-status.txt
            cat dist/remediation/alternate/migration-integrity.txt
            cat dist/remediation/alternate/promotion-status.txt
          } > dist/remediation/alternate/verification-provenance.txt
          # The experiment is evidence-only; it cannot pass or bypass the original candidate gate.
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planora-dependency-candidate-${{ github.sha }}
          path: dist/remediation/
          if-no-files-found: warn
          retention-days: 14
