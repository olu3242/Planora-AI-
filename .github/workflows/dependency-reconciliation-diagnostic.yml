name: Dependency reconciliation candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Report conflict locations
        run: node scripts/check-dependency-conflicts.mjs || true
      - name: Explain remediation boundary
        run: |
          echo 'Dependency resolution requires an explicitly reviewed package.json.'
          echo 'Do not regenerate package-lock.json from a conflicted manifest.'
          echo 'Select compatible Next.js, React, Prisma and tooling versions before npm install --package-lock-only.'
          echo 'This diagnostic workflow does not modify, deploy, or approve dependencies.'
