name: B5 isolated ESLint replacement gate
on:
  push:
    branches: [work/b1-b10-release-certification-20261022]
    paths: ['.github/workflows/b5-eslint-replacement-gate.yml', 'eslint.candidate.config.mjs', 'scripts/check-eslint-parity.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planora_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: planora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      APP_URL: http://127.0.0.1:3000
      SESSION_COOKIE_NAME: planora_ci_session
      SESSION_TTL_HOURS: '12'
      TEST_DATABASE_URL: postgresql://planora_test:local_ci_only@127.0.0.1:5432/planora_test?schema=public
      DATABASE_URL: postgresql://planora_test:local_ci_only@127.0.0.1:5432/planora_test?schema=public
      TEST_RUNTIME_DATABASE_URL: postgresql://planora_runtime:local_ci_runtime_2026@127.0.0.1:5432/planora_test?schema=public
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install baseline
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/check-eslint-canaries.mjs
      - name: Evaluate dependency replacement in CI workspace only
        run: |
          npm uninstall --save-dev eslint-config-next --ignore-scripts --no-audit --no-fund
          npm install --save-dev typescript-eslint eslint-plugin-react eslint-plugin-react-hooks eslint-plugin-jsx-a11y eslint-plugin-import globals --ignore-scripts --no-audit --no-fund
          mkdir -p dist/b5
          cp package.json package-lock.json dist/b5/
      - name: Verify replacement negative canary coverage (not full rule parity)
        run: |
          node --input-type=module <<'NODE'
          import { ESLint } from 'eslint';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const ts = require('typescript-eslint');
          const hooks = require('eslint-plugin-react-hooks');
          const a11y = require('eslint-plugin-jsx-a11y');
          const nextRule = {
            meta: { type: 'problem', schema: [], messages: { raw: 'Use next/image.' } },
            create(ctx) { return { JSXOpeningElement(n) { if(n.name.type === 'JSXIdentifier' && n.name.name === 'img') ctx.report({node:n,messageId:'raw'}); } }; }
          };
          const config = [
            ...ts.configs.recommended,
            { files: ['**/*.{tsx,jsx}'], plugins: { 'react-hooks': hooks, 'jsx-a11y': a11y, '@next/next': { rules: { 'no-img-element': nextRule } } }, rules: { ...hooks.configs.recommended.rules, ...a11y.configs.recommended.rules, '@next/next/no-img-element': 'warn' } }
          ];
          const eslint = new ESLint({ overrideConfigFile: true, overrideConfig: config });
          const fixtures = [
            ['raw image', "export default function A(){return <img src='/x' alt='x'/>}", '@next/next/no-img-element'],
            ['keyboard', 'export default function A(){return <div onClick={()=>{}}>A</div>}', 'jsx-a11y/click-events-have-key-events'],
            ['hooks', "import {useState} from 'react'; export default function A({x}:{x:boolean}){if(x)useState(0);return null}", 'react-hooks/rules-of-hooks']
          ];
          for (const [name, code, rule] of fixtures) {
            const [result] = await eslint.lintText(code,{filePath:'app/__candidate__.tsx'});
            const observed = result.messages.map(m=>m.ruleId);
            console.log(name, observed);
            if(!observed.includes(rule)) throw new Error(name+' missing '+rule);
          }
          NODE
      - name: Verify candidate rule parity against baseline
        env:
          PLANORA_CANDIDATE_ESLINT_CONFIG: eslint.candidate.config.mjs
        run: |
          if [ ! -s eslint.candidate.config.mjs ]; then
            echo 'BLOCKED: real replacement ESLint configuration not supplied' >&2
            exit 1
          fi
          node scripts/check-eslint-parity.mjs
      - name: Record full rule-parity gate as pending
        run: |
          echo 'B5 negative canaries are smoke tests, NOT complete ESLint rule parity.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Full parity must compare a real replacement configuration against the baseline before dependency integration.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run database-independent application checks
        run: |
          npm run typecheck
          npm run test:unit
          npm run test:financial
          npm run test:excel
          npm run build
      - name: Require isolated database before security integration tests
        run: |
          npm run db:migrate:test
          npm run db:seed:test
          node --import tsx scripts/provision-test-runtime.ts
          npm run test:security
          npm run test:performance
          npm run test:integration
      - name: Validate isolated database schema after test execution
        if: ${{ success() }}
        run: npm run db:status:test
      - name: Report isolated database gate status
        if: ${{ !cancelled() }}
        run: |
          echo 'Database gate: isolated loopback PostgreSQL service configured; test outcomes reported separately' >> "$GITHUB_STEP_SUMMARY"
      - name: Run full security audit on replacement graph
        if: ${{ success() || failure() }}
        run: |
          if [ ! -f package-lock.json ]; then
            echo 'BLOCKED: dependency graph was not installed; audit cannot run' >&2
            exit 1
          fi
          npm audit --audit-level=moderate
      - name: Preserve manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b5-eslint-replacement-evidence
          path: dist/b5/
          retention-days: 14
