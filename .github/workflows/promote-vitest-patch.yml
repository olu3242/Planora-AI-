name: Promote verified Vitest patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    if: github.ref == 'refs/heads/feat/public-experience-showcase-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Generate patched manifest and lockfile together
        run: |
          npm install --save-dev --save-exact vitest@4.1.12 @vitest/coverage-v8@4.1.12 --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/check-dependency-conflicts.mjs
      - name: Verify security and compatibility
        run: |
          npm audit --json > audit-candidate.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const a = JSON.parse(readFileSync('audit-candidate.json', 'utf8'));
          const v = a.vulnerabilities ?? {};
          const summary = a.metadata?.vulnerabilities ?? {};
          if (Object.keys(v).some((name) => name === 'vitest' || name.startsWith('@vitest/')) || (summary.moderate ?? 0) > 0 || (summary.critical ?? 0) > 0) {
            console.error('Vitest candidate failed vulnerability gate', summary);
            process.exit(1);
          }
          console.log('Vitest vulnerabilities cleared; remaining findings:', summary);
          NODE
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:financial
          npm run test:excel
          node --test tests/security/public-experience-guard.test.mjs
          npx vitest run tests/performance/forecast-volume.test.ts -t 'parses, profiles, and maps 10,000 CSV rows within the interactive budget'
      - name: Commit both dependency files as one change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Already reconciled'
          else
            git commit -m 'fix(deps): upgrade Vitest and coverage to patched 4.1.12'
            git push origin HEAD:feat/public-experience-showcase-20261018
          fi
